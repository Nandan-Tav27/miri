name: test-5084-open-dir

# Scratch workflow for investigating https://github.com/rust-lang/miri/issues/5084.
# Runs the directory-open test on a Windows host against a Linux target, which is
# the cross-target scenario where the bug reproduces. Triggers on every push to
# the findings branch, plus a manual button.
on:
  push:
    branches:
      - nandan-test-5048
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  open-dir:
    name: open-dir on Windows host (linux target)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/workflows/setup

      - name: Build Miri
        run: ./miri build

      - name: Run directory-open test against the Linux target
        run: ./miri test --target x86_64-unknown-linux-gnu libc-open-dir
